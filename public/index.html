<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Registration & OTP Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #1877f2;
      --primary-glow: rgba(24, 119, 242, 0.35);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: radial-gradient(circle at top, #151f38 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(24, 119, 242, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(24, 119, 242, 0.3);
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .box-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .email-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      color: #93c5fd;
      font-size: 16px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .email-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.25);
    }

    .email-input::placeholder {
      color: #6b7280;
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .otp-section {
      text-align: center;
      padding: 25px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px dashed rgba(16, 185, 129, 0.3);
      margin-top: 20px;
      display: none;
    }

    .otp-code {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--success);
      margin: 10px 0;
    }

    .status-msg {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 15px;
      text-align: center;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">Hostinger IMAP Connected</div>
    <h1>Facebook Account Helper</h1>
    <p class="subtitle">നിങ്ങൾ ഉപയോഗിക്കുന്ന ഇമെയിൽ ഇവിടെ ടൈപ്പ് ചെയ്യുക അല്ലെങ്കിൽ റാൻഡം ഇമെയിൽ ജനറേറ്റ് ചെയ്യുക.</p>

    <div class="box">
      <div class="box-label">Facebook Email Address</div>
      <input type="email" id="emailInput" class="email-input" placeholder="Enter your email (e.g. alexanderwright@qudraw.com)" />
      
      <div class="btn-group">
        <button class="btn-secondary" onclick="generateRandomEmail()">🔄 Random Email</button>
        <button class="btn-primary" onclick="copyEmail()">📋 Copy Email</button>
      </div>
    </div>

    <button id="listenBtn" class="btn-primary" style="width: 100%; padding: 14px;" onclick="startListening()">
      ⚡ Listen for Facebook OTP
    </button>

    <div id="otpSection" class="otp-section">
      <div style="font-size: 13px; color: var(--success); font-weight: 700;">FACEBOOK CONFIRMATION CODE</div>
      <div id="otpDisplay" class="otp-code">-----</div>
      <button class="btn-secondary" style="margin-top: 10px;" onclick="copyOtp()">Copy OTP</button>
    </div>

    <div id="statusMsg" class="status-msg">Facebook-ൽ ഇമെയിൽ സബ്മിറ്റ് ചെയ്ത ശേഷം 'Listen for Facebook OTP' ക്ലിക്ക് ചെയ്യുക.</div>
  </div>

  <script>
    const emailInput = document.getElementById('emailInput');

    async function generateRandomEmail() {
      emailInput.value = 'Generating...';
      try {
        const res = await fetch('/api/generate-email');
        const data = await res.json();
        emailInput.value = data.email;
        document.getElementById('otpSection').style.display = 'none';
        document.getElementById('statusMsg').innerText = "Email ready! Copy and paste on Facebook.";
      } catch (e) {
        emailInput.value = '';
        alert('Error generating random email');
      }
    }

    function copyEmail() {
      const email = emailInput.value.trim();
      if (!email) {
        alert('Please enter or generate an email first!');
        return;
      }
      navigator.clipboard.writeText(email);
      alert('Email copied: ' + email);
    }

    function copyOtp() {
      const otp = document.getElementById('otpDisplay').innerText;
      navigator.clipboard.writeText(otp);
      alert('OTP copied: ' + otp);
    }

    async function startListening() {
      const email = emailInput.value.trim();
      if (!email) {
        alert('Please enter or generate an email address first!');
        emailInput.focus();
        return;
      }

      const btn = document.getElementById('listenBtn');
      const status = document.getElementById('statusMsg');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Checking Hostinger Inbox...';
      status.innerText = "Hostinger INBOX & Junk ഫോൾഡറുകളിൽ Facebook OTP പരിശോധിക്കുന്നു...";

      try {
        const res = await fetch('/api/get-fb-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        const data = await res.json();

        if (data.success && data.otp) {
          document.getElementById('otpDisplay').innerText = data.otp;
          document.getElementById('otpSection').style.display = 'block';
          status.innerText = "✅ OTP കണ്ടെത്തി! കോപ്പി ചെയ്ത് Facebook-ൽ നൽകുക.";
          navigator.clipboard.writeText(data.otp);
        } else {
          status.innerText = "❌ " + (data.error || "OTP കിട്ടിയില്ല, വീണ്ടും ശ്രമിക്കുക.");
        }
      } catch (err) {
        status.innerText = "❌ Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "⚡ Listen for Facebook OTP";
      }
    }

    // Set default placeholder or initial random email
    generateRandomEmail();
  </script>

</body>
</html>
